services:

  postgres:
    image: postgis/postgis:16-3.4

    container_name: agricultural_twin_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: agricultural_twin
      POSTGRES_USER: twin_user
      POSTGRES_PASSWORD: twin_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U twin_user -d agricultural_twin"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  postgres_data: